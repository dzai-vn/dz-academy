project:
  type: website
  output-dir: docs

website:
  title: "DZ AI Academy"
  description: "Chia sẻ tri thức Data Analytics, Python và AI cho cộng đồng Việt Nam"

  navbar:
    background: primary
    search: true
    left:
      - text: "Bài viết"
        href: posts/index.qmd
      - text: "Tutorials"
        href: tutorials/index.qmd
      - text: "Demos"
        href: demos/index.qmd
      - text: "Roadmap"
        href: roadmap/index.qmd
    right:
      - text: "Về tôi"
        href: about.qmd
      - icon: github
        href: https://github.com/dzai-vn

  page-footer:
    center: "© 2026 DZ AI Academy · [GitHub](https://github.com/dzai-vn)"

  open-graph: true
  twitter-card: true

format:
  html:
    theme: cosmo
    css: assets/styles.css
    toc: true
    toc-depth: 3
    link-external-newwindow: true
    smooth-scroll: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
